#--------------------------------------------------------------------------------
# Touchscreen code
#--------------------------------------------------------------------------------         
touchscreen:
  platform: xpt2046
  id: my_touchscreen
  display: display1
  cs_pin: ${cs_pin}
  # any touch resets the LCD blank timer (pir_time) so the screen
  # never blanks while the user is interacting
  on_touch:
    - lambda: id(pir_time) = 0;
  calibration:
    x_min: 260
    x_max: 3900
    y_min: 200
    y_max: 3800
