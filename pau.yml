display:
  #- platform: ili9xxx
  - platform: mipi_spi
    model: ili9341
    id: display1
    dc_pin: ${dc_pin}
    reset_pin: ${reset_pin}
    invert_colors: false
    update_interval: 1s
    spi_mode: MODE0
    pages:
# Startup splash screen
      - id: page_startup
        lambda: |-
          it.printf(120, 160, id(mnuFont), TextAlign::CENTER, "P.A.U. starting");
# Show page home screen
      - id: page1
        lambda: |-
          //----------------------------------------
          // Blank screen if PIR off
          //----------------------------------------
          if (id(app_flow) == APP_FLOW_OFF) {
            return;
          }

          //----------------------------------------
          // Print default screen styling
          //----------------------------------------   
          setup_page(it);
          it.image(20, 240, id(menu));

          //----------------------------------------
          // Homescreen
          //----------------------------------------
          if (id(app_flow) == APP_FLOW_HOME) {
            // First set of sensor readings
            if (id(homescreen_index) == 0) {
              print_sensor_row(it, 35, "Water flow", id(flowmeter_water).state, ": %.2f m3/h");
              print_sensor_row(it, 60, "Fairland flow", id(flowmeter_heatpump).state, ": %.2f m3/h");
              print_sensor_row(it, 85, "pH level", id(ezo_ph).state, ": %.2f");
              it.print(6, 110, id(mnuFont), "pH setpoint");
              it.printf(122, 110, id(mnuFont), ": %.2f", id(ph_expected_value));
              print_onoff_row(it, 135, "Acid pump", id(acidDosingPump).state);
              print_sensor_row(it, 160, "Rx level", id(ezo_rx).state, ": %.0f mV");
              it.print(6, 185, id(mnuFont), "Rx setpoint");
              it.printf(122, 185, id(mnuFont), ": %d mV", id(rx_expected_value));
              print_onoff_row(it, 210, "CL pump", id(chlorineDosingPump).state);
              return;
            }

            // Second set of sensor readings
            else if (id(homescreen_index) == 1) {
              it.print(120, 35, id(mnuFont), TextAlign::TOP_CENTER, "Temperatures");
              print_sensor_row(it, 60, "Pool in", id(temp_to_pool).state, ": %.2f °C");
              print_sensor_row(it, 85, "Pool out", id(temp_from_pool).state, ": %.2f °C");
              print_sensor_row(it, 110, "Fairland", id(temp_from_inverter).state, ": %.2f °C");
              print_sensor_row(it, 135, "Poolhouse", id(temp_poolhouse).state, ": %.2f °C");
              print_sensor_row(it, 160, "Outside", id(temp_outside).state, ": %.2f °C");
              print_sensor_row(it, 185, "Humidity", id(hum_outside).state, ": %.0f %%");
              return;
            }
            
            // Third set of sensor readings
            else if (id(homescreen_index) == 2) {
              it.print(120, 35, id(mnuFont), TextAlign::TOP_CENTER, "Invertek drive");
              print_onoff_row(it, 60, "State", id(drive_state).state);
              print_sensor_row(it, 85, "Frequency", id(out_freq).state, ": %.0f Hz");
              print_sensor_row(it, 110, "Temp", id(drive_temp).state, ": %.0f  °C");
              print_sensor_row(it, 135, "Power", id(out_curr).state, ": %.0f A");
              print_sensor_row(it, 160, "Ramp time", id(drive_ramp_set).state, ": %.0f s");
              print_onoff_row(it, 185, "Tripped", id(drive_tripped).state);
              return;
            }
            
            // fourth set of sensor readings
            else if (id(homescreen_index) == 3) {
             it.print(120, 35, id(mnuFont), TextAlign::TOP_CENTER, "Fairland heatpump");
             print_onoff_row(it, 60, "State", id(fairland_power_status).state);
             print_sensor_row(it, 85, "Compressor", id(fairland_compressor_frequency).state, ": %.0f Hz");
             print_sensor_row(it, 110, "Speed", id(fairland_compressor_speed).state, ": %.0f %%");
             print_sensor_row(it, 135, "Inlet", id(fairland_water_inlet).state, ": %.0f °C");
             print_sensor_row(it, 160, "Outlet", id(fairland_water_outlet).state, ": %.0f °C");
             it.print(6, 185, id(mnuFont), "Mode");
             if (id(fairland_working_mode).active_index() == 0) {
               it.printf(122, 185, id(mnuFont), ": Smart");
             } else if (id(fairland_working_mode).active_index() == 1){
               it.printf(122, 185, id(mnuFont), ": Silence");
             } else {
                it.printf(122, 185, id(mnuFont), ": S Silence");
             }
              print_sensor_row(it, 210, "Setpoint", id(heatpump_setpoint).state, ": %.0f °C");
             }
            else if (id(homescreen_index) == 4) {
               it.print(120, 35, id(mnuFont), TextAlign::TOP_CENTER, "Power");
               print_sensor_row(it, 60, "Fairland", id(fairland_pulse_counter).state, ": %.1f W");
               print_sensor_row(it, 85, "Flair", id(flair_pulse_counter).state, ": %.1f W");
               it.print(120, 110, id(mnuFont), TextAlign::TOP_CENTER, "Energy since boot");
               print_sensor_row(it, 135, "Fairland", id(fairland_pulse_counter_total).state, ": %.3f kWh");
               print_sensor_row(it, 160, "Flair", id(flair_pulse_counter_total).state, ": %.3f kWh");
            }
            return;
          }
