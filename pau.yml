              - select.set:
                  id: drive_freq_set
                  option: "37 Hz"
            else:
              - select.set:
                  id: drive_freq_set
                  option: "25 Hz"
        - lambda: 'id(app_flow) = APP_FLOW_HOME;'
        - switch.turn_off: btnboostLed
        - display.page.show: page1
        

