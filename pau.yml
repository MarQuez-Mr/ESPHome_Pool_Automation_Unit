#--------------------------------------------------------------------------------
# Selects
#-------------------------------------------------------------------------------- 
select:
# select logger level  
  - platform: logger
    name: "Logger select"

# Drive frequency selector
  - platform: modbus_controller
    modbus_controller_id: drive
    id: drive_freq_set
    name: "Drive Frequency"
    address: 1
    value_type: U_WORD
    icon: mdi:sine-wave
    optimistic: true
    optionsmap:
      '25 Hz': 250
      '37 Hz': 370
      '50 Hz': 500

#function mode
  - platform: modbus_controller
    modbus_controller_id: fairland_controller
    name: Fairland Function
    address: 0
    value_type: U_WORD
    optimistic: true
    optionsmap:
      'Auto': 0
      'Heating': 1
      'Cooling': 2
    disabled_by_default: true

# Working mode
  - platform: modbus_controller
    modbus_controller_id: fairland_controller
    name: Fairland Mode
    id: fairland_working_mode
    address: 1
    value_type: U_WORD
    optimistic: true
    optionsmap:
      'Smart': 0
      'Silence': 1
      'Super Silence': 2

# plp scene select
  - platform: template
    id: plp_scene_select
    name: "PLP Scene"
    optimistic: true
    options:
      - "Deep Blue Sea"
      - "Daylight Blue"
      - "Sunset"
      - "Love Is In The Air"
      - "Forest Spring"
      - "Think Pink"
      - "Sunshine"
      - "Jungle Beach"
      - "Voodoo"
      - "Disco"
      - "Party"
      - "Warm White"
      - "Neutral White"
      - "Sun White"
    set_action:
      - lambda: |-
          int idx = 0;
          for (int i = 0; i < PLP_SCENE_COUNT; i++) {
            if (x == plp_scenes[i]) { idx = i; break; }
          }
          id(uart_light).write_str(plp_scene_cmd(idx));
          ESP_LOGI("plp", "TX SCENE: %s", plp_scene_cmd(idx));
          id(current_scene) = idx;  // keep internal scene index in sync

# PLP color temperature selector
  - platform: template
    name: "PLP Color Temperature"
    optimistic: true
    options:
      - "3000K"
      - "3500K"
      - "4000K"
      - "4500K"
      - "5000K"
      - "5500K"
      - "6000K"
      - "6500K"
      - "7000K"
      - "7500K"
      - "8000K"
      - "8500K"
      - "9000K"
      - "9500K"
      - "10000K"
      - "10500K" 
    set_action:
      - lambda: |-
          std::map<std::string, std::string> temp_map = {
            {"3000K", "PT030"},
            {"3500K", "PT035"},
            {"4000K", "PT040"},
            {"4500K", "PT045"},
            {"5000K", "PT050"},
            {"5500K", "PT055"},
            {"6000K", "PT060"},
            {"6500K", "PT065"},
            {"7000K", "PT070"},
            {"7500K", "PT075"},
            {"8000K", "PT080"},
            {"8500K", "PT085"},
            {"9000K", "PT090"},
            {"9500K", "PT095"},
            {"10000K", "PT100"},
            {"10500K", "PT105"}
          };
          if (temp_map.count(x)) {
            id(uart_light).write_str(temp_map[x].c_str());
            ESP_LOGI("plp", "TX TEMP: %s", temp_map[x].c_str());
          }

# Summer / winter mode
  - platform: template
    name: "Season selector"
    id: "season_selector"
    optimistic: true
    options:
      - Fall
      - Spring
      - Summer
      - Winter
    initial_option: Summer
    restore_value: true

#--------------------------------------------------------------------------------
# Scripts
#--------------------------------------------------------------------------------
script:
  #########################################################
  # PLP scripts
  #########################################################
  - id: plp_send_on
    then:
      - lambda: |-
          id(uart_light).write_str("PL1");
          ESP_LOGI("plp", "TX ON: PL1");

  - id: plp_send_off
    then:
      - lambda: |-
          id(uart_light).write_str("PL0");
          ESP_LOGI("plp", "TX OFF: PL0");

  - id: plp_send_brightness
    then:
      - lambda: |-
          int bri = id(last_sent_bri);
          if (bri < 0) bri = 0;
          if (bri > 100) bri = 100;
          char cmd[8];
          sprintf(cmd, "PD%03d", bri);
          id(uart_light).write_str(cmd);
          ESP_LOGI("plp", "TX BRI: %s", cmd);

  - id: plp_send_rgb
    then:
      - lambda: |-
          char cmd[20];
          sprintf(cmd, "PC%03d%03d%03d", id(base_r), id(base_g), id(base_b));
          id(uart_light).write_str(cmd);
          ESP_LOGI("plp", "TX RGB: %s", cmd);
    
  #########################################################
  # Set drive start time based on time picker
  #########################################################
  - id: adjust_drive_start_time
    mode: restart
    parameters:
      hour_delta: int
      minute_delta: int
    then:
      - datetime.time.set:
          id: start_time_drive
          time: !lambda |-
            uint8_t hour = (id(start_time_drive).hour + hour_delta + 24) % 24;
            uint8_t minute = (id(start_time_drive).minute + minute_delta + 60) % 60;
            return {.minute = minute, .hour = hour};
  
  #########################################################
  # Set drive end time based on time picker
  #########################################################
  - id: adjust_drive_end_time
    mode: restart
    parameters:
      hour_delta: int
      minute_delta: int
    then:
      - datetime.time.set:
          id: end_time_drive
          time: !lambda |-
            uint8_t hour = (id(end_time_drive).hour + hour_delta + 24) % 24;
            uint8_t minute = (id(end_time_drive).minute + minute_delta + 60) % 60;
            return {.minute = minute, .hour = hour};
  #########################################################
  # Set fairland start time based on time picker
  #########################################################

  - id: adjust_fairland_start_time
    mode: restart
    parameters:
      hour_delta: int
      minute_delta: int
    then:
      - datetime.time.set:
          id: start_time_fairland
          time: !lambda |-
            uint8_t hour = (id(start_time_fairland).hour + hour_delta + 24) % 24;
            uint8_t minute = (id(start_time_fairland).minute + minute_delta + 60) % 60;
            return {.minute = minute, .hour = hour};
  #########################################################
  # Set fairland end time based on time picker
  #########################################################
  - id: adjust_fairland_end_time
    mode: restart
    parameters:
      hour_delta: int
      minute_delta: int
    then:
      - datetime.time.set:
          id: end_time_fairland
          time: !lambda |-
            uint8_t hour = (id(end_time_fairland).hour + hour_delta + 24) % 24;
            uint8_t minute = (id(end_time_fairland).minute + minute_delta + 60) % 60;
            return {.minute = minute, .hour = hour};

  #########################################################
  # Shared dispatch: touchscreen value buttons on setpoint pages.
  # Active page decides which value the +/- buttons adjust.
  #########################################################
  - id: adjust_screen_value
    mode: restart
    parameters:
      direction: int   # +1 or -1
    then:
      - if:
          condition:
            display.is_displaying_page: page4_3
          then:
            - lambda: |-
                float sp = id(heatpump_setpoint).state;
                auto call = id(heatpump_setpoint).make_call();
                call.set_value(sp + (direction * 1));
                call.perform();
      - if:
          condition:
            display.is_displaying_page: page5_2
          then:
            - lambda: |-
                float ph = id(ph_expected_value);
                auto call = id(set_ph_level).make_call();
                call.set_value(ph + (direction * 0.1));
                call.perform();
      - if:
          condition:
            display.is_displaying_page: page6_2
          then:
            - lambda: |-
                int rx = id(rx_expected_value);
                auto call = id(set_rx_level).make_call();
                call.set_value(rx + (direction * 25));
                call.perform();
      - if:
          condition:
            display.is_displaying_page: page8
          then:
            - lambda: |-
                float temp = id(freeze_detection_temp);
                auto call = id(set_freeze_temp).make_call();
                call.set_value(temp + (direction * 1));
                call.perform();

  #########################################################
  # Shared dispatch: touchscreen time picker buttons.
  # Active page decides which datetime is adjusted.
  #########################################################
  - id: adjust_screen_time
    mode: restart
    parameters:
      hour_delta: int
      minute_delta: int
    then:
      - if:
          condition:
            display.is_displaying_page: page3_1
          then:
            - script.execute:
                id: adjust_drive_start_time
                hour_delta: !lambda 'return hour_delta;'
                minute_delta: !lambda 'return minute_delta;'
      - if:
          condition:
            display.is_displaying_page: page3_2
          then:
            - script.execute:
                id: adjust_drive_end_time
                hour_delta: !lambda 'return hour_delta;'
                minute_delta: !lambda 'return minute_delta;'
      - if:
          condition:
            display.is_displaying_page: page4_1
          then:
            - script.execute:
                id: adjust_fairland_start_time
                hour_delta: !lambda 'return hour_delta;'
                minute_delta: !lambda 'return minute_delta;'
      - if:
          condition:
            display.is_displaying_page: page4_2
          then:
      - script.execute:
          id: adjust_fairland_end_time
          hour_delta: !lambda 'return hour_delta;'
          minute_delta: !lambda 'return minute_delta;'

  #########################################################
  # Shared dispatch: back button.
  # Pointer table maps current page -> parent page; flow value >= 0
  # also resets app_flow, -1 leaves it untouched.
  #########################################################
  - id: navigate_back
    mode: restart
    then:
      - lambda: |-
          auto cur = id(display1).get_active_page();
          if (cur == nullptr) {
            ESP_LOGW("navigate_back", "No active page.");
            return;
          }
          struct Nav { display::DisplayPage *from; display::DisplayPage *to; int flow; };
          static const Nav nav[] = {
            {page3, page2, -1}, {page4, page2, -1}, {page5, page2, -1},
            {page6, page2, -1}, {page7, page2, -1}, {page8, page7, -1},
            {page11, page7, -1}, {page12, page7, -1}, {page13, page7, -1},
            {page14, page7, -1},
            {page3_1, page3, -1}, {page3_2, page3, -1}, {page3_3, page3, -1},
            {page4_1, page4, -1}, {page4_2, page4, -1}, {page4_3, page4, -1},
            {page4_4, page4, -1},
            {page5_1_4, page5, -1}, {page5_2, page5, -1}, {page6_2, page6, -1},
            {page5_1_1, page5, APP_FLOW_HOME},
            {page5_1_2, page5, APP_FLOW_HOME},
            {page5_1_3, page5, APP_FLOW_HOME},
            {page6_1_1, page6, APP_FLOW_CAL_RX},
            {page6_1_2, page6, APP_FLOW_CAL_RX},
          };
          for (const auto &n : nav) {
            if (cur == n.from) {
              if (n.flow >= 0)
                id(app_flow) = n.flow;
              id(display1).show_page(n.to);
              return;
            }
          }
          if (cur == page2) {
            id(app_flow) = APP_FLOW_HOME;
            id(display1).show_page(page1);
            return;
          }
          ESP_LOGW("navigate_back", "No back mapping for active page.");

  #########################################################
  # Shared dispatch: calibration okay buttons (advance steps only).
  # Finish steps (pH step 4, Rx step 6) keep delay+timestamp in the
  # button automation — mode: restart here would kill the 300s delay.
  #########################################################
  - id: calibration_ok
    mode: restart
    parameters:
      step: int   # 1=pH mid, 2=pH low, 3=pH high, 5=Rx 225mV
    then:
      - if:
          condition:
            lambda: 'return step == 1;'
          then:
            - display.page.show: page5_1_2
            - lambda: id(ezo_ph).set_calibration_point_mid(7.00);
            - lambda: id(app_flow) = APP_FLOW_CAL_PH;
      - if:
          condition:
            lambda: 'return step == 2;'
          then:
            - display.page.show: page5_1_3
            - lambda: id(ezo_ph).set_calibration_point_low(4.00);
            - lambda: id(app_flow) = APP_FLOW_CAL_PH;
      - if:
          condition:
            lambda: 'return step == 3;'
          then:
            - display.page.show: page5_1_4
            - lambda: |-
                id(ezo_ph).set_calibration_point_high(10.00);
            - lambda: id(app_flow) = APP_FLOW_CAL_PH;
      - if:
          condition:
            lambda: 'return step == 5;'
          then:
            - display.page.show: page6_1_2
            - lambda: |-
                id(ezo_rx).set_calibration_generic(225);
            - lambda: id(app_flow) = APP_FLOW_CAL_RX;

  #########################################################
  # LCD screen, turn off the LCD after 300 seconds of inactivity, but only if no motion is detected
  #########################################################
  - id: turn_off_lcd_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return (id(pir_time) >= 300 && id(app_flow) == APP_FLOW_HOME);
          then:
            - lambda: |-
                id(app_flow) = APP_FLOW_OFF;
            - light.turn_off: lcd_backlight_light

  #########################################################
  # Drive Schedule
  #########################################################
  - id: drive_schedule
    mode: restart
    then:
      - lambda: |-
          auto time = id(current_time).now();

          if (!time.is_valid()) {
            ESP_LOGW("drive schedule", "Time is not initialized.");
            return;
          }

          // Convert current time to minutes since midnight
          int now_mins = time.hour * 60 + time.minute;

          // Get template times
           int start_mins = id(start_time_drive).hour * 60 + id(start_time_drive).minute;
           int end_mins = id(end_time_drive).hour * 60 + id(end_time_drive).minute;
           bool in_schedule = in_time_window(now_mins, start_mins, end_mins);

           // ❄️ 1. Enable pump if it's freezing outside
           if (id(temp_outside).state <= id(freeze_detection_temp)) {
             if (!id(drive_state).state) {
               id(drive_state).turn_on();
             }
             ESP_LOGI("Pump enabled", "Outside temperature is lower than %.1f°C", id(temp_outside).state);
             id(dosing_script) = true;
             return;
          }

           // 🧪 2. Enable pump if either chemical pump is running
           else if ((id(chlorineDosingPump).state) || (id(acidDosingPump).state)) {
             if (!id(drive_state).state) {
               id(drive_state).turn_on();
             }
             ESP_LOGI("Pump enabled", "Chlorine pump state: %d or Acid pump state: %d.",
                     id(chlorine_pump_state), id(acid_pump_state));
             id(dosing_script) = false;
            return;
          }

           // 🧹 3. Enable pump if app flow state indicates boost (e.g., backwashing)
           else if (id(app_flow) == APP_FLOW_BOOST) {
             if (!id(drive_state).state) {
               id(drive_state).turn_on();
             }
             ESP_LOGI("check_pool_parameters", "Drive boost enabled.");
             id(dosing_script) = false;
             return;
          }

           // 🕒 4. Enable pump during scheduled operation hours
            else if (in_schedule) {
               id(drive_state).turn_on();
             ESP_LOGI("Pump enabled", "Time is between %02d:%02d and %02d:%02d",
                      id(start_time_drive).hour, id(start_time_drive).minute,
                      id(end_time_drive).hour, id(end_time_drive).minute);
            id(dosing_script) = true;
            id(ezo_disabler_rx).turn_on();
            id(ezo_disabler_ph).turn_on();
            id(ezo_interval_enabled) = true;
            return;
          }

           // 🚫 5. Disable pump outside scheduled hours and if no other conditions met
           else {
             if (id(drive_state).state) {
               id(drive_state).turn_off();
             }
             ESP_LOGI("Pump disabled", "Outside schedule: %02d:%02d and %02d:%02d", 
                        id(end_time_drive).hour, id(end_time_drive).minute, 
                        id(start_time_drive).hour, id(start_time_drive).minute);
            id(dosing_script) = false;
            id(ezo_disabler_rx).turn_off();
            id(ezo_disabler_ph).turn_off();
            id(ezo_interval_enabled) = false;
            return;
          }

  #########################################################
  # Fairland Schedule
  #########################################################
  - id: fairland_schedule
    mode: restart
    then:
      - lambda: |-
          auto time = id(current_time).now();

          if (!time.is_valid()) {
            ESP_LOGW("fairland", "Time is not initialized.");
            return;
          }
          
          // Convert current time to minutes since midnight
          int now_mins = time.hour * 60 + time.minute;

          // Get template times
           int start_mins = id(start_time_fairland).hour * 60 + id(start_time_fairland).minute;
           int end_mins = id(end_time_fairland).hour * 60 + id(end_time_fairland).minute;
            bool in_schedule = in_time_window(now_mins, start_mins, end_mins);

            if (in_schedule) {
             if (!id(fairland_power).state) {
               id(fairland_power).turn_on();
             }
             ESP_LOGI("Fairland enabled", "Time is between %02d:%02d and %02d:%02d",
                     id(start_time_fairland).hour, id(start_time_fairland).minute,
                     id(end_time_fairland).hour, id(end_time_fairland).minute);
           } 
           else {
             if (id(fairland_power).state) {
               id(fairland_power).turn_off();
             }
             ESP_LOGI("Fairland disabled", "Outside schedule: %02d:%02d and %02d:%02d",
                     id(end_time_fairland).hour, id(end_time_fairland).minute,
                     id(start_time_fairland).hour, id(start_time_fairland).minute);
          }

  #########################################################
  # Check Temperature correction
  #########################################################
  - id: temperature_correction_ph
    mode: restart
    then:
      - lambda: |-
          if (isnan(id(temp_from_pool).state)) {
            ESP_LOGW("temperature_correction", "Pool temperature unavailable.");
            return;
          }
          id(ezo_ph).set_t(id(temp_from_pool).state);

  #########################################################
  # 🔁 MAIN ENTRY POINT
  #########################################################
  - id: check_pool_parameters
    mode: restart
    then:
      - logger.log:
          format: "▶️ Starting pool parameter check"
          level: "INFO"
          tag: "check_pool_parameters"
      - script.execute: check_dosing_requirements

  #########################################################
  # 📋 STEP 1: CHECK PRE-DOSING REQUIREMENTS
  #########################################################
  - id: check_dosing_requirements
    mode: restart
    then:
      - lambda: |-
          // Check if required sensors are initialized
          if (isnan(id(flowmeter_water).state) || isnan(id(flowmeter_heatpump).state) || isnan(id(ezo_ph).state) || isnan(id(ezo_rx).state)) {
            ESP_LOGI("check_pool_parameters", "❌ No chemical dosing: sensor(s) not initialized.");
            id(stop_dosing_pumps).execute();
            id(abort_dosing).execute();
            return;
          }

          // Check if there's flow in the system
          //ESP_LOGI("check_pool_parameters", "Sensor state: %s", id(water_flow_fairland).state ? "ON" : "OFF");
          //ESP_LOGI("check_pool_parameters", "Sensor state: %s", id(water_flow_fairland_ext).state ? "ON" : "OFF");


          bool flow_system = (id(flowmeter_water).state > 0);
          bool flow_heatpump1 = (id(flowmeter_heatpump).state > 0);
          bool flow_fairland = id(water_flow_fairland).state;
          //bool flow_fairland_ext = id(water_flow_fairland_ext).state;
           if (!flow_heatpump1 && !flow_system && !flow_fairland) {
             id(pump_runtime) = 0;
             ESP_LOGI("check_pool_parameters", "❌ No chemical dosing: no flow.");
             id(stop_dosing_pumps).execute();
             id(abort_dosing).execute();
              return;
          }

          // Update and verify pump runtime
          id(pump_runtime) += 30;
          if (id(pump_runtime) < 600) {
            ESP_LOGI("check_pool_parameters", "⏳ Waiting: pump runtime = %d (min 600)", id(pump_runtime));
            id(abort_dosing).execute();
            return;
          }

          // Check if pH is dangerously high
           if (id(ezo_ph).state > 8.5) {
             ESP_LOGI("check_pool_parameters", "❌ pH too high (%.2f) — manual correction needed.", id(ezo_ph).state);
             id(stop_dosing_pumps).execute();
             id(abort_dosing).execute();
              return;
          }

          // Skip if in calibration mode
          if (id(app_flow) == APP_FLOW_CAL_PH || id(app_flow) == APP_FLOW_CAL_RX) {
            ESP_LOGI("check_pool_parameters", "⛔ Skipping: sensor calibration in progress.");
            id(abort_dosing).execute();
            return;
          }

          // Skip if in boost/backwash mode during peak hours
          if (id(app_flow) == APP_FLOW_BOOST) {
            ESP_LOGI("check_pool_parameters", "⚡ Skipping: boost mode (likely backwashing/vacuuming).");
            id(abort_dosing).execute();
            return;
          }

          // Skip if a dosing pump is already active
          if ((id(chlorineDosingPump).state) || (id(acidDosingPump).state)) {
            ESP_LOGI("check_pool_parameters", "⛔ Dosing pump already active. Skipping.");
            id(abort_dosing).execute();
            return;
          }

          // Ensure enough time has passed since last dose
          int last_dose = max(id(last_acid_dose), id(last_chlorine_dose));
          int since_last = id(app_runtime) - last_dose;
          if (since_last < 60) {
            ESP_LOGI("check_pool_parameters", "🕒 Too soon since last dose (%d s < 60 s).", since_last);
             id(abort_dosing).execute();
              return;
          }

          // All preconditions met — start dosing decision chain
          ESP_LOGI("check_pool_parameters", "✅ All preconditions met — starting dosing decision.");
          id(check_acid_dosing).execute();

  #########################################################
  # 🧪 STEP 2: ACID DOSING DECISION
  #########################################################
  - id: check_acid_dosing
    mode: restart
    then:
      - logger.log:
          format: "check_acid_dosing executed"      
          level: "INFO"
          tag: "check_acid_dosing"
      - lambda: |-
          bool should_dose_acid = id(ezo_ph).state > id(ph_expected_value);

          if (id(acid_startup_lockout)) {
            ESP_LOGI("dosing", "Acid dosing locked after startup.");
            return;
          }

          // Skip if pH calibration was recent
          if (should_dose_acid && id(last_ph_calibration) > 0) {
            int since_cal = id(app_runtime) - id(last_ph_calibration);
            if (since_cal < 600) {
              ESP_LOGI("check_pool_parameters", "🧪 Skip acid dosing: pH calibration too recent (%d seconds).", since_cal);
              should_dose_acid = false;
            }
          }

          // Skip if acid was dosed recently
          if (should_dose_acid && id(last_acid_dose) > 0) {
            int since_acid = id(app_runtime) - id(last_acid_dose);
            if (since_acid < 3600) {
              ESP_LOGI("check_pool_parameters", "🧪 Skip acid dosing: last acid dose was %d seconds ago.", since_acid);
              should_dose_acid = false;
            }
          }

          // Trigger acid dosing
          if (should_dose_acid) {
            ESP_LOGI("check_pool_parameters", "💧 Dosing acid (pH = %.2f)", id(ezo_ph).state);
            id(acidDosingPump).turn_on();
            return;
          }
      - delay: 10ms
      - logger.log: 
          format: "No conditions met — starting check_chlorine_dosing script"
          level: "INFO"
          tag: "check_acid_dosing"
      - script.execute: check_chlorine_dosing

  #########################################################
  # 🧼 STEP 3: CHLORINE DOSING DECISION
  #########################################################
  - id: check_chlorine_dosing
    mode: restart
    then:
      - logger.log:
          format: "check_chlorine_dosing executed"      
          level: "INFO"
          tag: "check_chlorine_dosing"
      - lambda: |-
          // check if acid pump is already active
          if (id(acidDosingPump).state) {
            ESP_LOGI("check_pool_parameters", "⛔ Dosing acid pump already active. 🧼 Skip dosing chlorine.");
            return;
          }

          bool should_dose_chlorine = (id(ezo_ph).state < 7.8 && id(ezo_rx).state <= id(rx_expected_value));

          if (id(chlorine_startup_lockout)) {
            ESP_LOGI("dosing", "Chlorine dosing locked after startup.");
            return;
          }

          // no dosing needed due to correct levels        
          if (!should_dose_chlorine)  {
            ESP_LOGI("check_pool_parameters", "No 🌊 chlorine dosing needed, Rx level %.0f is above expected value %d", id(ezo_rx).state, id(rx_expected_value));
            return;
          }

          // Skip if Rx calibration was recent
          if (should_dose_chlorine && id(last_rx_calibration) > 0) {
            int since_rx_cal = id(app_runtime) - id(last_rx_calibration);
            if (since_rx_cal < 600) {
              ESP_LOGI("check_pool_parameters", "🧼 Skip chlorine dosing: recent Rx calibration (%d seconds).", since_rx_cal);
              should_dose_chlorine = false;
            }
          }

          // Skip if chlorine was dosed recently
          if (should_dose_chlorine && id(last_chlorine_dose) > 0) {
            int since_chlorine = id(app_runtime) - id(last_chlorine_dose);
            if (since_chlorine < 1800) {
              ESP_LOGI("check_pool_parameters", "🧼 Skip chlorine dosing: last chlorine dose was %d seconds ago.", since_chlorine);
              should_dose_chlorine = false;
            }
          }

          // Trigger chlorine dosing
          if (should_dose_chlorine) {
            ESP_LOGI("check_pool_parameters", "🌊 Dosing chlorine (Rx = %.0f)", id(ezo_rx).state);
            id(chlorineDosingPump).turn_on();
          }

  #########################################################
   # 🛑 ABORT SCRIPT — WHEN CONDITIONS ARE NOT MET
   #########################################################
  - id: stop_dosing_pumps
    mode: restart
    then:
      - switch.turn_off: chlorineDosingPump
      - switch.turn_off: acidDosingPump
      - lambda: |-
          id(chlorine_pump_state) = false;
          id(acid_pump_state) = false;

  - id: abort_dosing
    mode: restart
    then:
      - logger.log:
          format: "⚠️ Dosing logic aborted due to current pool conditions"
          level: "INFO"
          tag: "abort_dosing"

