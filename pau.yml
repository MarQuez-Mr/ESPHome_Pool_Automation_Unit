    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

# wifi step
  - platform: template
    id: wifistep
    internal: true
    update_interval: never
    lambda: |-
      if (isnan(id(wifisignal).state)) {
        return 0;
      }
      return round((id(wifisignal).state + 100) / 10);

# debug
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"

# PH sensor
  - platform: ezo
    id: ezo_ph
    name: "pH"
    icon: mdi:ph
    address: 99
    #unit_of_measurement: "pH"
    device_class: ph
    update_interval: never
    accuracy_decimals: 2
    filters:
      - lambda: |-
          constexpr size_t window_size = 10;
          static float samples[window_size] = {};
          static size_t next_sample = 0;
          static size_t sample_count = 0;
          static size_t values_since_publish = 0;
          static bool was_calibrating = false;

          const bool calibrating = id(app_flow) == APP_FLOW_CAL_PH || id(app_flow) == APP_FLOW_CAL_RX;

          if (calibrating) {
            if (!was_calibrating) {
              sample_count = 0;
              next_sample = 0;
              values_since_publish = 0;
            }
            was_calibrating = true;

            if (isnan(x)) {
              return {};
            }
            return x;
          }

          if (was_calibrating) {
            sample_count = 0;
            next_sample = 0;
            values_since_publish = 0;
            was_calibrating = false;
          }

          if (isnan(x)) {
            return {};
          }

          samples[next_sample] = x;
          next_sample = (next_sample + 1) % window_size;

          if (sample_count < window_size) {
            sample_count++;
          }

          values_since_publish++;

          if (sample_count < window_size || values_since_publish < 10) {
            return {};
          }

          values_since_publish = 0;

          float sum = 0.0f;
          for (size_t i = 0; i < sample_count; i++) {
            sum += samples[i];
          }

          return sum / sample_count;
    on_slope:
      - lambda: |-
          id(on_slope_text).publish_state(x);
    on_calibration:
      - lambda: |-
          id(on_calibration_text).publish_state(x);
    on_t:
      - lambda: |-
          id(on_temperature_text).publish_state(x);

# Rx sensor
  - platform: ezo
    id: ezo_rx
    name: "Rx"
    icon: mdi:water-circle
    address: 98
    unit_of_measurement: "mV"
    device_class: voltage
    update_interval: never
    filters:
      - lambda: |-
          constexpr size_t window_size = 5;
          static float samples[window_size] = {};
          static size_t next_sample = 0;
          static size_t sample_count = 0;
          static size_t values_since_publish = 0;
          static bool was_calibrating = false;

          const bool calibrating = id(app_flow) == APP_FLOW_CAL_PH || id(app_flow) == APP_FLOW_CAL_RX;

          if (calibrating) {
            if (!was_calibrating) {
              sample_count = 0;
              next_sample = 0;
              values_since_publish = 0;
            }
            was_calibrating = true;

            if (isnan(x) || x > 1000) {
              return {};
            }
            return x;
          }

          if (was_calibrating) {
            sample_count = 0;
            next_sample = 0;
            values_since_publish = 0;
            was_calibrating = false;
          }

          if (isnan(x) || x > 1000) {
            return {};
          }

          samples[next_sample] = x;
          next_sample = (next_sample + 1) % window_size;

          if (sample_count < window_size) {
            sample_count++;
          }

          values_since_publish++;

          if (sample_count < window_size || values_since_publish < 5) {
            return {};
          }

          values_since_publish = 0;

          float sum = 0.0f;
          for (size_t i = 0; i < sample_count; i++) {
            sum += samples[i];
          }

          return sum / sample_count;
    on_calibration:
      - lambda: |-
          id(on_calibration_rx_text).publish_state(x);

