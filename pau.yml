#--------------------------------------------------------------------------------
# Substitutions used further down in the code
#--------------------------------------------------------------------------------
substitutions:
  web_port: "80"
  web_version: "2"
  name: "pau"
  friendly_name: "Pool Automation Unit"
  comment: "All in one swimming pool controller"
  area: "Tuinhuis"
  gpioRestartButton: GPIO01
  gpioStatusLed: GPIO02
  relay6: GPIO04
  relay5: GPIO05
  gpioAcidDosing: GPIO06
  gpioChlorineDosing: GPIO07
  gpioHeatpumpFlow: GPIO08
  i2c_sda: GPIO09 #TX
  i2c_scl: GPIO10 #RX
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  gpioBacklight: GPIO14
  gpioFairlandkWh: GPIO15
  gpioFlairkWh: GPIO16
  gpioOnewire: GPIO17
  gpioWaterFlow: GPIO18
  reset_pin: GPIO21
  gpioPir: GPIO38
  uart_tx_drive: GPIO40 # in pcb design GPIO39/RXA labels are switched (RI)
  uart_rx_drive: GPIO39 # in pcb design GPIO40/TXA labels are switched (RO)
  uart_tx_light: GPIO42 #TXB
  uart_rx_light: GPIO41 #RXB
  uart_tx_fairland: GPIO43 #TXC
  uart_rx_fairland: GPIO44 #RXC
  dc_pin: GPIO47
  cs_pin: GPIO48
#--------------------------------------------------------------------------------
# Default config
#--------------------------------------------------------------------------------

esphome:
  includes:
    - display_helpers.h
    - plp_helper.h
    - schedule_helper.h
  name: ${name}
  friendly_name: ${friendly_name}
  comment: ${comment}
  area: ${area}
  name_add_mac_suffix: false
  #debug_scheduler: true
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return id(season_selector).current_option() == "Winter";'
          then:
            - select.set:
                id: drive_freq_set
                option: "25 Hz"
          else:
            - select.set:
                id: drive_freq_set
                option: "37 Hz"
      - component.update: drive_on_boot_ramp
      - lambda: |-
          int rx  = 0;
          rx = (id(rx_expected_value));
          auto call = id(set_rx_level).make_call();
          call.set_value(rx);
          call.perform();
      - lambda: |-
          float ph  = 0.0;
          ph = (id(ph_expected_value));
          auto call = id(set_ph_level).make_call();
          call.set_value(ph);
          call.perform();
      - display.page.show: page1
          
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  #hardware_uart: USB_CDC
  level: INFO
  baud_rate: 0
  # logs:
    # modbus: INFO
    # modbus_controller: INFO
    # modbus.number: INFO
    # modbus_controller.sensor: INFO
    # modbus_controller.binary_sensor: INFO
    # modbus_controller.select: INFO
    # sensor: DEBUG
    # number: INFO
    # switch: INFO
    # select: INFO
    # pulse_counter: INFO
    # text_sensor: INFO
    # component: ERROR
    # touchscreen: ERROR
    # ili9xxx: ERROR
    # dallas.temp.sensor: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret pool-automation-unit_api_key
  reboot_timeout: 0s
  actions:
    - action: set_pulse_total_fairland
      variables:
        new_pulse_total: int
      then:
        - pulse_counter.set_total_pulses:
            id: fairland_pulse_counter
            value: !lambda 'return new_pulse_total;'
    - action: set_pulse_total_flair
      variables:
        new_pulse_total: int
      then:
        - pulse_counter.set_total_pulses:
            id: flair_pulse_counter
            value: !lambda 'return new_pulse_total;'

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .not.internal
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "pool-automation-unit"
    password: !secret pool-automation-unit_ap_password

captive_portal:

#web server esp
web_server:
  port: ${web_port}
  version: ${web_version}
  ota: false

debug:
  update_interval: 57s

#Display pins
spi:
  clk_pin: ${clk_pin}
  mosi_pin: ${mosi_pin}
  miso_pin: ${miso_pin}

#--------------------------------------------------------------------------------
# Onewire sensors (dallas temperature)
#--------------------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: ${gpioOnewire}

#--------------------------------------------------------------------------------
# Setup i2c - used for pH and Rx 
#--------------------------------------------------------------------------------
i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  id: bus_a
  frequency: 400kHz

# Modbus Master on UART1
modbus:
  - id: modbus_drive
    uart_id: uart_drive
    turnaround_time: 100ms
    send_wait_time: 200ms

# Modbus Master on UART2
  - id: modbus_fairland
    uart_id: uart_fairland
    turnaround_time: 100ms
    send_wait_time: 200ms

tca9555:
  - id: 'tca9555_hub'
    address: 0x20
    
#--------------------------------------------------------------------------------
# Setup time component
#--------------------------------------------------------------------------------
time:
  - platform: sntp
    id: current_time
    timezone: "Europe/Amsterdam"
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org

#--------------------------------------------------------------------------------
# Global variables used further down in the code
#--------------------------------------------------------------------------------
globals:
  # Holds value if screen should be blanked out; see APP_FLOW_* defines in display_helpers.h
  # 0 - TFT OFF (APP_FLOW_OFF)
  # 1 - Default (APP_FLOW_HOME)
  # 2 - pH calibration (APP_FLOW_CAL_PH)
  # 3 - Rx calibration (APP_FLOW_CAL_RX)
  # 4 - Boost for vacuming or backwash (APP_FLOW_BOOST)

  - id: app_flow
    type: int
    initial_value: '1'

  # Timers for keeping track of last values
  - id: app_runtime
    type: int
    initial_value: '0'

  - id: pump_runtime
    type: int
    initial_value: '0'

  - id: last_ph_calibration
    type: int
    initial_value: '0'

  - id: last_rx_calibration
    type: int
    initial_value: '0'

  - id: last_acid_dose
    type: int
    initial_value: '0'

  - id: last_chlorine_dose
    type: int
    initial_value: '0'

  - id: rx_expected_value  
    type: int
    initial_value: '675'
    restore_value: true

  - id: ph_expected_value  
    type: float
    initial_value: '7.4'
    restore_value: true

  - id: temperature_correction
    type: float
    initial_value: '0'

  - id: chlorine_pump_state
    type: bool
    initial_value: 'false'

  - id: acid_pump_state
    type: bool
    initial_value: 'false'

  - id: pir_time
    type: int
    initial_value: '0'

  - id: freeze_detection_temp
    type: float
    initial_value: '1'

  - id: ezo_interval_enabled
    type: bool
    restore_value: no
    initial_value: "true"

# Holds which homescreen is active (0..3)
  - id: homescreen_index
    type: int
    initial_value: '0'

  - id: dosing_script
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: acid_startup_lockout
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: chlorine_startup_lockout
    type: bool
    restore_value: no
    initial_value: 'true'

  # base color (hue) independent of brightness
  - id: base_r
    type: int
    initial_value: '255'
  - id: base_g
    type: int
    initial_value: '255'
  - id: base_b
    type: int
    initial_value: '255'

  # last sent values to avoid flooding
  - id: last_sent_r
    type: int
    initial_value: '-1'
  - id: last_sent_g
    type: int
    initial_value: '-1'
  - id: last_sent_b
    type: int
    initial_value: '-1'
  - id: last_sent_bri
    type: int
    initial_value: '-1'

  # scene tracking (0..13)
  - id: current_scene
    type: int
    initial_value: '0'
    
#--------------------------------------------------------------------------------
# Setup Datetime component
#--------------------------------------------------------------------------------
datetime:
# Drive
  - platform: template
    id: start_time_drive
    type: time
    name: Drive Start Time
    optimistic: yes
    restore_value: true

  - platform: template
    id: end_time_drive
    type: time
    name: Drive End Time
    optimistic: yes
    restore_value: true

 # Fairland   
  - platform: template
    id: start_time_fairland
    type: time
    name: Fairland Start Time
    optimistic: yes
    restore_value: true

  - platform: template
    id: end_time_fairland
    type: time
    name: Fairland End Time
    optimistic: yes
    restore_value: true

# --------------------------------------------------------------------------------
# Interval for scripts, sensors and ph temp correction
# --------------------------------------------------------------------------------
interval:
# interval 5s for home screen and drive schedule
  - interval: 5s
    startup_delay: 3s
    then:
      - lambda: |-
          id(drive_schedule).execute();
          id(homescreen_index) = (id(homescreen_index) + 1) % 5;

# interval 10s for calibration sensor updates
  - interval: 10s
    startup_delay: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(app_flow) == APP_FLOW_CAL_PH || id(app_flow) == APP_FLOW_CAL_RX;
          then:
            - logger.log:
                format: "Calibration interval enabled"
                level: INFO
                tag: calibration_script
            - component.update: ezo_ph
            - delay: 3s
            - component.update: ezo_rx
          else:
            - logger.log:
                format: "Calibration interval disabled."
                level: DEBUG
                tag: calibration_script

# interval 30s for dosing script and LCD timer
  - interval: 30s
    startup_delay: 7s
    then:
      - lambda: |-
          id(app_runtime)+= 30;
          if (id(app_runtime) >= 3600) {
            id(acid_startup_lockout) = false;
          }
          if (id(app_runtime) >= 1800) {
            id(chlorine_startup_lockout) = false;
          }
          if (id(dosing_script)) {
            ESP_LOGI("dosing_script", "Running dosing logic...");
            id(check_pool_parameters).execute();
          } else {
            ESP_LOGI("dosing_script", "Dosing script is disabled.");
          }
          id(pir_time)+= 30;
          id(turn_off_lcd_timer).execute();

# interval 60s for Temp sensors
  - interval: 60s
    startup_delay: 13s
    then:
      - component.update: temp_poolhouse
      - delay: 2s
      - component.update: temp_from_pool
      - delay: 2s
      - component.update: temp_from_inverter
      - delay: 2s
      - component.update: temp_to_pool
      - delay: 2s

# Interval for EZO sensors
  - interval: 60s
    startup_delay: 17s
    then:
      - if:
          condition:
            lambda: "return id(ezo_interval_enabled);"
          then:
            - component.update: ezo_ph
            - delay: 3s
            - component.update: ezo_rx

# Interval for pulse_counters
  - interval: 60s
    startup_delay: 21s
    then:
      - component.update: flowmeter_water
      - delay: 7s
      - component.update: flowmeter_heatpump
      - delay: 7s
      - component.update: fairland_pulse_counter
      - delay: 7s
      - component.update: flair_pulse_counter

# interval 60s for wifi sensors
  - interval: 60s
    startup_delay: 26s
    then:
      - component.update: wifisignal
      - delay: 1s
      - component.update: wifistep

# interval 60s for text_sensors
  - interval: 60s
    startup_delay: 33s
    then:
      - component.update: uptime_text
      - delay: 1s
      - component.update: on_calibration_text
      - delay: 1s
      - component.update: on_temperature_text
      - delay: 1s
      - component.update: on_slope_text
      - delay: 1s
      - component.update: on_calibration_rx_text

# interval 60s for fairland schedule
  - interval: 60s
    startup_delay: 37s
    then:
      - lambda: |-
          if (id(season_selector).current_option() == "Summer") {
              id(fairland_schedule).execute();
              ESP_LOGI("fairland_schedule", "Fairland script is enabled.");
              // retrieve fairland data
              id(fairland_controller).update();
          } else {
            ESP_LOGI("fairland_schedule", "Fairland script is disabled.");
            if (id(fairland_power).state) {
               id(fairland_power).turn_off();
             }
          }
        
# interval 3600s for temp correction pH sensor
  - interval: 3600s
    then:
      - lambda: |-  
          id(temperature_correction_ph).execute();

#--------------------------------------------------------------------------------
# Light config
#--------------------------------------------------------------------------------
light:
  # status led
  - platform: status_led
    id: esp_state
    pin: 
      number: ${gpioStatusLed}
      inverted: true
  # pool lights
  - platform: rgb
    name: "Pool Lights"
    id: pool_lights
    red: dummy_r
    green: dummy_g
    blue: dummy_b

    # voor stabiliteit: start altijd uit (voorkomt onverwachte acties bij reboot)
    restore_mode: ALWAYS_OFF

    on_turn_on:
      then:
        - script.execute: plp_send_on
        - delay: 80ms
        - script.execute: plp_send_brightness
        - delay: 80ms
        - script.execute: plp_send_rgb

    on_turn_off:
      then:
        - script.execute: plp_send_off

    on_state:
      then:
        - lambda: |-
            // Only act when HA light is ON
            if (!id(pool_lights).remote_values.is_on())
              return;

            // Brightness (0..100)
            float bri_f = id(pool_lights).remote_values.get_brightness();
            int bri = (int) lroundf(bri_f * 100.0f);
            if (bri < 0) bri = 0;
            if (bri > 100) bri = 100;

            if (bri != id(last_sent_bri)) {
              id(last_sent_bri) = bri;
              id(plp_send_brightness).execute();
            }

            // Compute "base" RGB independent of brightness by normalizing to max channel.
            float r_f = id(pool_lights).remote_values.get_red();
            float g_f = id(pool_lights).remote_values.get_green();
            float b_f = id(pool_lights).remote_values.get_blue();

            float m = fmaxf(r_f, fmaxf(g_f, b_f));
            if (m < 0.0001f)
              return;

            int br = (int) lroundf((r_f / m) * 255.0f);
            int bg = (int) lroundf((g_f / m) * 255.0f);
            int bb = (int) lroundf((b_f / m) * 255.0f);

            // Clamp
            br = br < 0 ? 0 : (br > 255 ? 255 : br);
            bg = bg < 0 ? 0 : (bg > 255 ? 255 : bg);
            bb = bb < 0 ? 0 : (bb > 255 ? 255 : bb);

            if (br != id(last_sent_r) || bg != id(last_sent_g) || bb != id(last_sent_b)) {
              id(last_sent_r) = br;
              id(last_sent_g) = bg;
              id(last_sent_b) = bb;

              id(base_r) = br;
              id(base_g) = bg;
              id(base_b) = bb;

              id(plp_send_rgb).execute();
            }

  # needed for backlight of TFT screen
  - platform: binary
    name: "LCD Backlight"
    id: lcd_backlight_light
    output: lcd_backlight
    restore_mode: ALWAYS_ON
    internal: true

# needed for rgb light, but doesn't do anything
output:
  - platform: template
    id: dummy_r
    type: float
    write_action: []
  - platform: template
    id: dummy_g
    type: float
    write_action: []
  - platform: template
    id: dummy_b
    type: float
    write_action: []

# needed for backlight of TFT screen
  - platform: gpio
    pin: ${gpioBacklight}
    id: lcd_backlight  
  
#--------------------------------------------------------------------------------
# Modbus config
#--------------------------------------------------------------------------------
uart:
  - id: uart_fairland
    tx_pin: ${uart_tx_fairland}
    rx_pin: ${uart_rx_fairland}
    baud_rate: 9600
    stop_bits: 1
    parity: none
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   debug_prefix: "[Command_fairland] "
    #   after:
    #     delimiter: "\n"
    #   sequence:
    #     - lambda: UARTDebug::log_string(direction, bytes, debug_prefix);

  - id: uart_drive
    tx_pin: ${uart_tx_drive}
    rx_pin: ${uart_rx_drive}
    baud_rate: 115200
    stop_bits: 1
    parity: none
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   debug_prefix: "[Command_drive] "
    #   after:
    #     delimiter: "\n"
    #   sequence:
    #     - lambda: UARTDebug::log_string(direction, bytes, debug_prefix);

  - id: uart_light
    tx_pin: ${uart_tx_light}
    rx_pin: ${uart_rx_light}
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false
    #   debug_prefix: "[Command_light] "
    #   after:
    #     delimiter: "\n"
    #   sequence:
    #     - lambda: UARTDebug::log_string(direction, bytes, debug_prefix);

modbus_controller:
# Inverter modbus
  - id: drive
    ## the Modbus device address
    address: 0x1
    modbus_id: modbus_drive
    setup_priority: -10
    update_interval: 60s
    max_cmd_retries: 2
    offline_skip_updates: 5
    on_online:
      then:
        - logger.log: 
            format: "Drive back online!"
            level: INFO
            tag: modbus_controller
    on_offline:
      then:
        - logger.log: 
            format: "Drive goes offline!"
            level: INFO
            tag: modbus_controller

  - id: drive_on_boot_ramp
    address: 0x1
    modbus_id: modbus_drive
    # No interval
    # Will be called on boot
    update_interval: never 

# Fairland modbus 
  - id: fairland_controller
    ## the Modbus device address
    address: 0x1
    modbus_id: modbus_fairland
    update_interval: never
    on_online:
      then:
        - logger.log: 
            format: "Fairland back online!"
            level: INFO
            tag: modbus_controller
    on_offline:
      then:
        - logger.log: 
            format: "Fairland goes offline!"
            level: INFO
            tag: modbus_controller
