    id: chlorineDosingPump
    icon: mdi:toggle-switch-off-outline
    restore_mode: ALWAYS_OFF
    inverted: true
    interlock: [acidDosingPump]
    interlock_wait_time: 30s
    on_turn_on:
      then:
        - if:
            condition:
              lambda: 'return id(chlorine_startup_lockout);'
            then:
              - logger.log:
                  format: "Chlorine dosing locked after startup."
                  level: WARN
                  tag: dosing
              - switch.turn_off: chlorineDosingPump
            else:
              - lambda: |-
                  id(last_chlorine_dose) = id(app_runtime);
                  id(chlorine_pump_state) = true;
              - delay: 120s
              - switch.turn_off: chlorineDosingPump
              - lambda: |-
                  id(chlorine_pump_state) = false;

